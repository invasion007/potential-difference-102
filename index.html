<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10.2 电势差 · 可交互课件</title>
<style>
  :root{
    /* 配色基准：原版 Manim（3Blue1Brown）—— 纯黑底 + 白线为主 + Manim 官方色常量
       红=φ>0 那一半面 蓝=φ<0 那一半面 黄=电势差 U（本课主角量） 金=W 柱；一屏彩色 ≤3 个色族 */
    --bg:#000000; --bg2:#0a0a0a; --panel:#0e0e0e; --line:#242424; --line2:#383838;
    --ink:#FFFFFF; --ink2:#B0B0B0; --muted:#888888;
    --pos:#FC6255; --neg:#58C4DD;
    --yellow:#FFFF00;   /* 结论色 Manim YELLOW：电势差 U */
    --gold:#F0AC5F;     /* 次强调 Manim GOLD：W 柱 */
    --green:#83C167;
    --phi:#9A72AC;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC","WenQuanYi Zen Hei",sans-serif;
    overflow:hidden;
  }
  .app{display:grid; grid-template-rows:auto auto 1fr auto auto; height:100vh;}

  /* ---------- 顶部 ---------- */
  header{display:flex; align-items:baseline; gap:14px; padding:10px 18px 8px; flex-wrap:wrap; row-gap:3px;
    background:var(--bg2); border-bottom:1px solid var(--line);}
  header h1{font-size:16px; margin:0; font-weight:600; letter-spacing:.5px; white-space:nowrap;}
  .act{font-size:13px; color:var(--yellow); border:1px solid var(--line2); border-radius:10px;
    padding:1px 9px; white-space:nowrap;}
  .steptitle{font-size:15px; color:var(--ink); font-weight:600;}
  .stepsn{margin-left:auto; font-size:13px; color:var(--ink2); font-variant-numeric:tabular-nums;}

  /* ---------- 主体 ---------- */
  .stage{display:grid; grid-template-columns:1fr 272px; min-height:0;}

  /* ---------- 顶部步骤导航条 ---------- */
  .topnav{display:flex; align-items:center; gap:5px; padding:5px 14px 6px;
    background:var(--bg2); border-bottom:1px solid var(--line); overflow-x:auto; overflow-y:hidden;}
  .topnav .grouplab{flex:0 0 auto; font-size:11px; letter-spacing:.6px; color:var(--muted); font-weight:600; white-space:nowrap;}
  .topnav .sep{flex:0 0 auto; width:1px; height:15px; background:var(--line2); margin:0 5px;}
  .topnav a{flex:0 0 auto; min-width:27px; height:22px; padding:0 7px; display:inline-flex; align-items:center; justify-content:center;
    font-size:12px; font-variant-numeric:tabular-nums; color:var(--ink2); background:#141414;
    border:1px solid var(--line2); border-radius:6px; cursor:pointer;}
  .topnav a:hover{background:#1e1e1e; color:var(--ink);}
  .topnav a.on{background:rgba(255,255,0,0.12); border-color:var(--yellow); color:var(--yellow); font-weight:700;}
  .canvaswrap{position:relative; min-width:0; min-height:0; padding:6px 8px 0 8px;}
  canvas{display:block; width:100%; height:100%;}
  .hint{padding:7px 20px 0 20px; font-size:12.5px; color:var(--muted); height:38px; overflow:hidden;}
  .hint b{color:var(--yellow); font-weight:600;}

  /* ---------- 右栏读数 ---------- */
  aside{background:var(--panel); border-left:1px solid var(--line); padding:10px 12px 14px; overflow-y:auto; min-height:0;}
  aside h3{font-size:12px; color:var(--muted); margin:14px 0 6px; font-weight:600; letter-spacing:.5px;}
  aside h3:first-child{margin-top:2px;}
  .rd{display:flex; align-items:baseline; justify-content:space-between; gap:8px; padding:3px 0;
    font-size:12.5px; color:var(--ink2); border-bottom:1px dashed #242424;}
  .rd span{white-space:nowrap;}
  .rd b{font-size:15px; color:var(--ink); font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .rd b.yellow{color:var(--yellow);}
  .rd b.gold{color:var(--gold);}
  .rd b.phi{color:var(--phi);}
  .rd b.green{color:var(--green);}
  .rd b.pos{color:var(--pos);}
  .rd b.neg{color:var(--neg);}
  .formula{font-size:13.5px; color:var(--ink); background:#141414; border:1px solid var(--line2);
    border-radius:8px; padding:8px 10px; line-height:1.5; word-break:break-word;}
  .note{font-size:12.5px; color:var(--ink2); line-height:1.62;}
  .note b{color:var(--yellow); font-weight:600;}
  .grp{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .grp .lab{font-size:12.5px; color:var(--muted);}
  button{font-family:inherit; font-size:12.5px; color:var(--ink2); background:#141414;
    border:1px solid var(--line2); border-radius:6px; padding:5px 10px; cursor:pointer; white-space:nowrap;}
  button:hover{background:#1e1e1e; color:var(--ink);}
  button.on{background:rgba(255,255,0,0.12); border-color:var(--yellow); color:var(--yellow); font-weight:700;}
  button.main{background:#1a1a1a; color:var(--ink);}

  /* ---------- 底栏 ---------- */
  footer{display:flex; align-items:center; gap:8px; flex-wrap:wrap; row-gap:6px;
    padding:8px 14px 9px; background:var(--bg2); border-top:1px solid var(--line);}
  .bar{position:relative; flex:1 1 150px; min-width:110px; height:6px; background:#141414; border-radius:3px; cursor:pointer;}
  .bar i{display:block; height:100%; width:0; background:var(--yellow); border-radius:3px;}
  .bar u{position:absolute; top:-2px; width:1px; height:10px; background:#4a4a4a;}
  .slider{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted);}
  .slider input[type=range]{width:96px; accent-color:#4a4a4a;}
  .slider b{color:var(--ink); font-variant-numeric:tabular-nums; min-width:34px; text-align:right;}
  .hidden{display:none !important;}

  @media (max-width: 760px){
    .stage{grid-template-columns:1fr;}
    aside{border-left:none; border-top:1px solid var(--line); max-height:34vh;}
    .hint{height:auto; min-height:34px; font-size:12px;}
    header h1{font-size:14px;}
    .steptitle{font-size:13px;}
    .slider input[type=range]{width:74px;}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>10.2 电势差</h1>
    <span class="act" id="actTag">第一幕</span>
    <span class="steptitle" id="stepTitle">—</span>
    <span class="stepsn" id="stepSn">1 / 21</span>
  </header>

  <nav class="topnav" id="toc" aria-label="步骤导航"></nav>

  <div class="stage">
    <div class="canvaswrap">
      <canvas id="cv"></canvas>
    </div>
    <aside>
      <div class="rd"><span>U<sub>AB</sub> = φA − φB</span><b class="yellow" id="rdUAB">+0 V</b></div>
      <div class="rd"><span>U<sub>BA</sub> = −U<sub>AB</sub></span><b class="yellow" id="rdUBA">−0 V</b></div>
      <div class="rd"><span>φA / φB</span><b id="rdPhi">0 / 0 V</b></div>
      <div class="rd"><span>W（这一段路）</span><b class="gold" id="rdW">0 J</b></div>
      <div class="rd"><span>电荷量 q</span><b id="rdQ">+1.0×10⁻⁹ C</b></div>
      <div class="rd"><span>场强 E</span><b id="rdE">80 V/m</b></div>
      <div class="rd"><span>零点 x₀</span><b id="rdX0">0.00 m</b></div>

      <h3>视角</h3>

        <button data-view="oblique">斜视</button>

      </div>
      <div class="note" style="margin-top:6px">在三维图上<b style="color:var(--gold)">拖动空白处</b>可自由旋转视角，滚轮缩放，双击复位。下面的俯视图始终是“物理空间”的正视图。</div>

      <h3>提示</h3>
      <div class="note" id="rdNote"></div>
    </aside>
  </div>

  <div class="hint" id="hint"></div>

  <footer>
    <button id="btnPrev">◀ 上一步</button>
    <button id="btnNext" class="main">下一步 ▶</button>
    <button id="btnReset">↺ 复位本步</button>
    <div class="bar" id="prog"><i></i></div>

    <div class="slider" id="wrapT">
      <span>走到哪儿</span><input type="range" id="rgT" min="0" max="100" value="100"><b id="lbT">100%</b>
    </div>
    <div class="slider" id="wrapLine">
      <span>沿面位置</span><input type="range" id="rgLine" min="0" max="100" value="50"><b id="lbLine">50%</b>
    </div>
    <div class="slider" id="wrapE">
      <span>场强 E</span><input type="range" id="rgE" min="60" max="120" step="5" value="80"><b id="lbE">80</b>
    </div>
    <div class="slider" id="wrapTheta">
      <span>倾角 θ</span><input type="range" id="rgTheta" min="0" max="40" step="1" value="25"><b id="lbTheta">25°</b>
    </div>
    <div class="grp" id="wrapPath">
      <span class="lab">路径</span>
      <button data-path="line">直线</button>
      <button data-path="poly">折线</button>
      <button data-path="curve">曲线</button>
    </div>
    <div class="grp" id="wrapQ">
      <span class="lab">电荷 q</span>
      <button data-q="2">+2q₀</button>
      <button data-q="1">+q₀</button>
      <button data-q="-1">−q₀</button>
      <button data-q="-2">−2q₀</button>
      <button data-q="-1.5">教材 q′</button>
    </div>
    <div class="grp" id="wrapDir">
      <span class="lab">方向</span>
      <button data-dir="AB">U_AB</button>
      <button data-dir="BA">U_BA</button>
    </div>
    <div class="grp" id="wrapMode">
      <span class="lab">电场</span>
      <button data-mode="uniform">匀强</button>
      <button data-mode="point">点电荷</button>
    </div>
  </footer>
</div>

<script>
/* =====================================================================
   viz_pd_physics.js —— 纯物理内核（不依赖 DOM，可在 node 里直接跑自检）

   课题：10.2 电势差 · 匀强电场里的"电势差"与"W = qU"
   口径（与教材 P31–34 例题逐条对齐，课上读数与课本同一套数）：
     E    = 80 V/m（方向 +x，沿 +x 电势降低）—— 可调 60–120
     x    ∈ [−2.8, 2.8] m；x0 = 零电势面位置（可拖）
     φ(x) = E(x0 − x)              V      相对量：与 x0 有关
     U_AB = φA − φB = E(xB − xA)   V      绝对量：与 x0 无关  ★本节主角
     W_AB = qU_AB = qE(xB − xA)    J      与路径无关、与力的大小无关
     U_BA = −U_AB；U_AB + U_BC = U_AC（中间项抵消）
     教材例题三点（E=80、x0=0）：xC=−0.75、xA=+0.75、xB=+1.75 m
       → φC=+60、φA=−60、φB=−140 V；U_AB=+80、U_BC=−200、U_AC=−120 V
     等势面：φ = k·ΔU 的那条线在 u = x0 − kΔU/E；相邻面间距 d = ΔU/E
     点电荷（第20–21步对照用，2D 剖面）：φ = kQ/r，等势面是同心球面的剖面
     反证法：假设的"等势面"与电场线夹角 θ → 沿面移动 s 的 Δu = s·sinθ
             → W = qE·s·sinθ ≠ 0，与"这是等势面"矛盾；θ=0 时 W=0
   ===================================================================== */
(function (global) {
  'use strict';

  var E_FIELD = 80;                 // 匀强电场场强 (V/m)，方向沿 +x
  var E_MIN = 60, E_MAX = 120;      // 场强可调范围 (V/m)
  var X_MIN = -2.8, X_MAX = 2.8;    // 场区范围 (m)
  var Q0 = 1.0e-9;                  // 电荷量单位 (C)：q = 倍率 × Q0
  var Q_LIST = [2, 1, -1, -2];      // 可切换的电荷量倍率
  var Q_EXAMPLE = -1.5;             // 教材例题第三刀的 q′ = −1.5×10⁻⁹ C（倍率）
  var DU = 40;                      // 等势面电势差步长 (V)："相邻等势面电势差相等"
  var KQ = 78;                      // 点电荷模式的 kQ (V·m)：φ = kQ/r
  var R_MIN = 0.35, R_MAX = 2.8;    // 点电荷模式的可视半径范围 (m)

  /* ---------- 匀强电场 ---------- */

  /** 电势：φ(x) = E(x0 − x)，与试探电荷无关（有正负，沿场线方向降低） */
  function phiAt(x, x0, E) {
    E = (E === undefined ? E_FIELD : E);
    return E * (x0 - x);
  }

  /** 电势差：U_AB = φA − φB = E(xB − xA) —— 与零点 x0 无关（★本节第一结论） */
  function uAB(xA, xB, E) {
    E = (E === undefined ? E_FIELD : E);
    return E * (xB - xA);
  }

  /** 反过来的电势差：U_BA = φB − φA = −U_AB */
  function uBA(xA, xB, E) { return -uAB(xA, xB, E); }

  /** 静电力做的功：W_AB = qU_AB = qE(xB − xA)，只与始末位置有关 */
  function work(q, x1, x2, E) {
    E = (E === undefined ? E_FIELD : E);
    return q * E * (x2 - x1);
  }

  /** 电势能：Ep = qφ = qE(x0 − x)（相对量，随零点变；ΔEp = −W 与零点无关） */
  function epAt(q, x, x0, E) {
    E = (E === undefined ? E_FIELD : E);
    return q * E * (x0 - x);
  }

  /** 静电力（带符号，沿 +x 为正） */
  function force(q, E) {
    E = (E === undefined ? E_FIELD : E);
    return q * E;
  }

  /** 电荷量倍率 → 库仑 */
  function qOf(mul) { return mul * Q0; }

  /** 匀强电场的等势面间距 d = ΔU / E（"越密 → 场强越大"） */
  function equivGap(dU, E) {
    E = (E === undefined ? E_FIELD : E);
    return dU / E;
  }

  /** 第 k 条等势面（φ = k·ΔU）所在的 u 坐标 */
  function contourU(k, x0, E, dU) {
    dU = (dU === undefined ? DU : dU);
    return x0 - k * dU / ((E === undefined ? E_FIELD : E));
  }

  /* ---------- 点电荷（2D 剖面，第20–21步对照用） ---------- */

  /** φ = kQ/r（正点电荷，向外电势降低） */
  function phiPoint(r, kq) {
    kq = (kq === undefined ? KQ : kq);
    return kq / Math.max(1e-6, r);
  }

  /**
   * 等势面（球面）半径序列：φ = k·ΔU → r = kQ/(kΔU)
   * 按 φ 从大到小（即从里到外）排列 → r 递增、相邻间距递增（越近越密）
   */
  function pointRadii(kq, dU, kMax) {
    kq = (kq === undefined ? KQ : kq);
    dU = (dU === undefined ? DU : dU);
    kMax = (kMax === undefined ? 4 : kMax);
    var out = [], k;
    for (k = kMax; k >= 1; k--) {
      var r = kq / (k * dU);
      if (r < R_MIN || r > R_MAX) { continue; }
      out.push({ k: k, phi: k * dU, r: r });
    }
    return out;
  }

  /* ---------- 反证法：假设的"等势面" ---------- */
  /* 真实等势面 ⟂ 电场线（θ=0）。假设它与电场线成 θ 角（θ≠0 时它根本不是等势面） */

  /** 假设面上沿面移动 s 时，沿场线方向的分量 Δu = s·sinθ */
  function alongComp(s, theta) { return s * Math.sin(theta); }

  /** 沿假设面移动 s 时静电力做的功：W = q·E·s·sinθ（θ=0 → 0） */
  function workOnAssumed(q, E, theta, s) {
    E = (E === undefined ? E_FIELD : E);
    return q * E * s * Math.sin(theta);
  }

  /** 沿假设面的场强分量 E∥ = E·sinθ（正是教材"电场强度有一个沿着等势面的分量"） */
  function parComp(E, theta) {
    E = (E === undefined ? E_FIELD : E);
    return E * Math.sin(theta);
  }

  /** 过 p0、与 v 轴（真等势面方向）成 θ 角的直线，半长 half（θ=0 即真等势面） */
  function assumedLine(p0, theta, half) {
    var du = Math.sin(theta), dv = Math.cos(theta);
    return [
      { x: p0.x - du * half, y: p0.y - dv * half },
      { x: p0.x + du * half, y: p0.y + dv * half }
    ];
  }

  /** 假设面上参数 t ∈ [0,1] 处的点（s 为离开 p0 的位移，带符号） */
  function assumedPoint(p0, theta, t, half) {
    var du = Math.sin(theta), dv = Math.cos(theta), s = (t - 0.5) * 2 * half;
    return { x: p0.x + du * s, y: p0.y + dv * s, s: s };
  }

  /* ---------- 路径（与 10.1 同构，供"沿路径走"复用） ---------- */

  /** 任意曲线：从 A 到 B 的平滑曲线（中点向上鼓），离散成 N 段 */
  function curvePoints(A, B, N) {
    N = Math.max(1, Math.round(N || 16));
    var amp = 0.45 + 0.35 * (B.y - A.y);
    var pts = [];
    for (var i = 0; i <= N; i++) {
      var t = i / N;
      pts.push({
        x: A.x + (B.x - A.x) * t,
        y: A.y + (B.y - A.y) * t + amp * Math.sin(Math.PI * t)
      });
    }
    return pts;
  }

  /**
   * 把一条折线拆成"每小段"的账：每段 =「沿场线的一步 Δu」＋「横穿的一步 Δv」
   *   沿场线：ΔW = qE·Δu      横穿：F ⊥ 位移 → ΔW = 0（等势面上移动不做功）
   */
  function accumulate(points, q, E) {
    E = (E === undefined ? E_FIELD : E);
    var segs = [], W = 0, sumDx = 0, sumDy = 0;
    for (var i = 0; i + 1 < points.length; i++) {
      var p1 = points[i], p2 = points[i + 1];
      var dx = p2.x - p1.x, dy = p2.y - p1.y;
      var wAlong = q * E * dx, wCross = 0;
      segs.push({ x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y, dx: dx, dy: dy, w: wAlong + wCross, wAlong: wAlong, wCross: wCross });
      W += wAlong + wCross; sumDx += dx; sumDy += dy;
    }
    return { W: W, sumDx: sumDx, sumDy: sumDy, segs: segs };
  }

  /** 三条典型路径：直线 A→B、折线 A→M→B（M 为 A 沿场线到 B 的垂足）、任意曲线 */
  function pathsFor(A, B, N) {
    var M = { x: B.x, y: A.y };
    return { M: M, line: [A, B], polyline: [A, M, B], curve: curvePoints(A, B, N) };
  }

  /* ---------- 自检 ---------- */

  function _eq(a, b, tol) { return Math.abs(a - b) <= (tol === undefined ? 1e-9 : tol); }

  function runSelfTest() {
    var fails = [], checks = 0;
    function ok(cond, msg) { checks++; if (!cond) { fails.push(msg); } }

    var x0s = [-1.6, -0.5, 0, 0.7, 1.6];
    var Es = [60, 80, 100, 120];
    var qs = [2, 1, -1, -2];
    var ABs = [
      [{ x: -1.4, y: -0.6 }, { x: 1.2, y: 0.6 }],
      [{ x: 0.75, y: 0 }, { x: 1.75, y: 0 }],
      [{ x: -2.4, y: 0.9 }, { x: -2.4, y: -0.9 }]
    ];
    var i, j, k, A, B, q, E, x0;

    /* 1) ★ U 与零点无关：同一对 A、B、同一个 E，随便换零点，U 完全相同 */
    for (i = 0; i < ABs.length; i++) {
      A = ABs[i][0]; B = ABs[i][1];
      for (j = 0; j < Es.length; j++) {
        E = Es[j];
        var u0 = uAB(A.x, B.x, E);
        for (k = 0; k < x0s.length; k++) {
          x0 = x0s[k];
          ok(_eq(u0, phiAt(A.x, x0, E) - phiAt(B.x, x0, E)),
            'U_AB 应与零点无关：x0=' + x0 + ' E=' + E);
        }
      }
    }

    /* 2) U_BA = −U_AB；可加性 U_AB + U_BC = U_AC（教材例题三点） */
    var xa = 0.75, xb = 1.75, xc = -0.75;

    var E = s.E, dU = P.DU, k, n = 0;
    for (k = -6; k <= 6; k++) {
      if (k === 0) { continue; }
      var u = P.contourU(k, s.x0, E, dU);
      if (u < U0 - 1e-6 || u > U1 + 1e-6) { continue; }
      var h = k * dU;
      seg(ctx, S.main(u, V0, h), S.main(u, V1, h), THEME.contour, 1.6);
      if (k % 2 === 0 && n < 4) {                    // 只标 4 处，避免堆字
        var lp = S.main(u, V1, h);
        text(ctx, h + ' V', lp.x, lp.y - 11, 'rgba(255,255,255,0.75)', 12);
        n++;
      }
    }
    if (n === 0 || S.W < 760) { return; }
    text(ctx, '等势面（ΔU = ' + dU + ' V 一条，等间距）', 16, S.mainH - 34, THEME.ink2, 12.5, 'left');
  }

  /** 零电势面（u = x0 处坡面与基准面相交的那条线） */
  function drawZeroLine(ctx, S, s) {
    var a = S.main(s.x0, V0, 0), b = S.main(s.x0, V1, 0);
    seg(ctx, a, b, THEME.zero, 2.6, [7, 5]);
    text(ctx, S.W < 760 ? 'φ = 0' : 'φ = 0（零电势面，可拖）', a.x + (s.x0 > 0 ? -8 : 8), a.y + 16,
      THEME.zero, 12.5, s.x0 > 0 ? 'right' : 'left');
  }

  /** 高度轴（φ / V） */
  function drawHeightAxis(ctx, S) {
    if (S.sh * 80 < 22) {                 // 俯视时高度在屏幕上退化
      var ny = (S.W < 760) ? (S.mainH - 12) : (S.mainH - 32);
      text(ctx, '俯视看不出高度 → 切「斜视 / 侧视」', 16, ny, 'rgba(136,136,136,0.9)', 12.5, 'left');
      return;
    }
    var cor = S.main(U0 - 0.05, V0 - 0.05, 0);
    var ax = Math.max(40, Math.min(cor.x - 18, S.W * 0.16));
    var y0 = cor.y;
    var top = y0 - HMAX * 0.78 * S.sh, bot = y0 + HMAX * 0.78 * S.sh;
    arrow(ctx, { x: ax, y: bot }, { x: ax, y: top }, 'rgba(255,255,255,0.45)', 1.4, 8);
    text(ctx, 'φ / V', ax + 22, top + 4, THEME.ink2, 12.5);
    for (var h = -160; h <= 160; h += 80) {
      var y = y0 - h * S.sh;
      if (Math.abs(h) > HMAX * 0.8) { continue; }
      seg(ctx, { x: ax - 5, y: y }, { x: ax + 5, y: y }, 'rgba(255,255,255,0.45)', 1.2);
      text(ctx, (h > 0 ? '+' : '') + h, ax - 9, y, THEME.muted, 11.5, 'right');
    }
    text(ctx, '0', ax - 9, y0, THEME.ink2, 11.5, 'right');
  }

  /* ---------- ★ 电势差量规：两根高度柱 + 一根黄色差值标尺 ---------- */
  /**
   * pa、pb = {u, v, name}；画出：
   *   两根白色高度柱（基准面 → 面高 = φ）
   *   顶端引出的白色虚线
   *   两顶端之间的黄色双向箭头 = U（dir='AB' 时标签 U_AB=φA−φB）
   * 俯视看不到高度时，退化到俯视图里画一根水平量规（U = E·Δu，水平距离就代表 U）
   */
  function drawGaugePair(ctx, S, s, pa, pb, dir, noLabel) {
    var x0 = s.x0, E = s.E;
    var phiA = P.phiAt(pa.u, x0, E), phiB = P.phiAt(pb.u, x0, E);
    var U = (dir === 'BA') ? (phiB - phiA) : (phiA - phiB);
    var lab = 'U_' + dir + ' = ' + (U > 0 ? '+' : '') + U.toFixed(0) + ' V';

    if (S.sh * 80 < 22) {                        // —— 俯视退化：水平量规 ——
      var a2 = S.strip(pa.u, pa.v), b2 = S.strip(pb.u, pb.v);
      dimArrow(ctx, a2, b2, THEME.yellow, 2.2);
      if (!noLabel) { text(ctx, lab, (a2.x + b2.x) / 2, a2.y - 16, THEME.yellow, 13.5, 'center', '700'); }
      return { U: U };
    }

    var baseA = S.main(pa.u, pa.v, 0), topA = S.main(pa.u, pa.v, phiA);
    var baseB = S.main(pb.u, pb.v, 0), topB = S.main(pb.u, pb.v, phiB);
    seg(ctx, baseA, topA, 'rgba(255,255,255,0.55)', 2);
    seg(ctx, baseB, topB, 'rgba(255,255,255,0.55)', 2);

    // 尺寸线：屏幕空间里竖直 —— 引线水平引到量规轨，竖直箭头的长度就是 |U| 的像素长度
    var laneX = Math.min(S.main(U1 - 0.28 + (pa.lane || 0), 0, 0).x, S.W - 148);
    var la = { x: laneX, y: topA.y }, lb = { x: laneX, y: topB.y };
    seg(ctx, topA, la, 'rgba(255,255,255,0.32)', 1.2, [4, 4]);
    seg(ctx, topB, lb, 'rgba(255,255,255,0.32)', 1.2, [4, 4]);
    dimArrow(ctx, la, lb, THEME.yellow, 2.2);
    if (!noLabel) { text(ctx, lab, laneX + 11, (la.y + lb.y) / 2, THEME.yellow, 13.5, 'left', '700'); }
    return { U: U };
  }

  /** ★ W 柱：金色柱高 = 倍率 × 落差（= W/Q0 的伏特当量），换 q 时变号变高、黄色量规不动 */
  function drawWorkBar(ctx, S, s) {
    if (S.sh * 80 < 22) { return null; }
    var u0 = s.walkFrom, q = s.q, E = s.E, x0 = s.x0;
    var U = P.uAB(u0, s.ball.x, E);
    var W = q * P.Q0 * U;                       // 真正的功 (J)
    var hv = clamp(q * U, -HMAX * 0.95, HMAX * 0.95);   // 柱高（伏特当量）
    if (Math.abs(hv) < 1e-6) { hv = 0; }
    var v = s.ball.y;
    var col = (W >= 0) ? THEME.gold : THEME.gold;
    var pb = S.main(s.ball.x, v, 0), pt = S.main(s.ball.x, v, hv);
    ctx.save();
    ctx.globalAlpha = 0.42; ctx.strokeStyle = col;
    ctx.lineWidth = Math.max(9, clamp(S.S * 0.09, 9, 18));
    ctx.beginPath(); ctx.moveTo(pb.x, pb.y); ctx.lineTo(pt.x, pt.y); ctx.stroke();
    ctx.restore();
    dot(ctx, pt, 4.5, THEME.gold);
    text(ctx, 'W = ' + fmtJ(W), pt.x + 16, pt.y - 2, THEME.gold, 13, 'left', '700');
    return { W: W, U: U };
  }

  /* ---------- 电荷（小球，永远贴在 φ 地形面上——φ 与 q 无关） ---------- */
  function drawBall(ctx, S, s, pos, qOverride) {
    var qq = (qOverride === undefined) ? s.q : qOverride;
    var phi = P.phiAt(pos.x, s.x0, s.E);
    var pg = S.main(pos.x, pos.y, phi);
    var r = clamp(S.S * (0.042 + 0.030 * Math.abs(qq)), 6.5, 24);
    ctx.save(); ctx.shadowColor = qq > 0 ? THEME.posLine : THEME.negLine; ctx.shadowBlur = 14;
    dot(ctx, pg, r, qq > 0 ? THEME.posLine : THEME.negLine);
    ctx.restore();
    ctx.save();
    ctx.fillStyle = '#000000'; ctx.font = '700 ' + Math.round(r * 1.5) + 'px "WenQuanYi Zen Hei",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(qq > 0 ? '+' : '−', pg.x, pg.y + 1);
    ctx.restore();
    return { phi: phi, pg: pg };
  }

  /* ---------- 路径 ---------- */
  function pathPts(s) { return P.pathsFor(s.A, s.B, s.N); }
  function pathOf(pts, key) {
    if (key === 'poly') { return pts.polyline; }
    if (key === 'curve') { return pts.curve; }
    return pts.line;
  }
  function activePath(s) { return pathOf(pathPts(s), s.pathMode); }

  /** 本步要走的“路”：A→B 三路径 / 过 A 的等势面 / 过 A 的假设面 */
  function walkPath(s) {
    if (s.show.assumed) { return P.assumedLine({ x: PIVOT_U, y: 0 }, s.theta, HALF); }
    if (s.show.equiLine) { return [{ x: PIVOT_U, y: -HALF }, { x: PIVOT_U, y: HALF }]; }
    return activePath(s);
  }
  function to3(S, s, pt) { return S.main(pt.x, pt.y, P.phiAt(pt.x, s.x0, s.E)); }
  function drawPath3(ctx, S, s, pts, color, width, dash) {
    ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = width || 2.6;
    if (dash) { ctx.setLineDash(dash); }
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (var i = 0; i < pts.length; i++) {
      var p = to3(S, s, pts[i]);
      if (i === 0) { ctx.moveTo(p.x, p.y); } else { ctx.lineTo(p.x, p.y); }
    }
    ctx.stroke(); ctx.restore();
  }

  /** ★ 反证法：假设的面（灰虚线，与电场线成 θ 角）+ 沿面场强分量 E∥ + 位移 */
  function drawAssumedFace(ctx, S, s) {
    var p0 = { x: PIVOT_U, y: 0 }, th = s.theta;
    var line = P.assumedLine(p0, th, HALF);
    // 主视图：沿假设面走 —— 这条路在爬坡/下坡（有高度变化 → 一定做功）
    drawPath3(ctx, S, s, line, THEME.assumed, 2.6, [8, 5]);
    // 真等势面（白细虚线）作对照：它才是平的
    seg(ctx, S.main(PIVOT_U, -HALF, P.phiAt(PIVOT_U, s.x0, s.E)),
           S.main(PIVOT_U, HALF, P.phiAt(PIVOT_U, s.x0, s.E)), 'rgba(255,255,255,0.45)', 1.4, [3, 4]);

    // 俯视图：把场强 E 分解到假设面上
    var a = S.strip(p0.x, p0.y), b = S.strip(p0.x + 0.9, p0.y);
    arrow(ctx, a, b, 'rgba(255,255,255,0.85)', 2, 8);
    text(ctx, 'E', b.x + 10, b.y - 10, THEME.ink, 13, 'center', '600');
    var dirn = { du: Math.sin(th), dv: Math.cos(th) };
    var len = 0.95 * Math.sin(th);                 // E∥ 的长度按 sinθ 缩
    if (len > 0.02) {
      var c = S.strip(p0.x + len * dirn.du, p0.y + len * dirn.dv);
      arrow(ctx, a, c, THEME.assumed, 3.4, 9);
      seg(ctx, b, c, 'rgba(136,136,136,0.6)', 1.4, [5, 4]);
      text(ctx, 'E∥ = E·sinθ = ' + P.parComp(s.E, th).toFixed(0) + ' V/m',
        c.x + 12, c.y + 14, THEME.assumed, 12.5, 'left', '600');
    }
    // 假设面本身（俯视图里的斜线）
    var q1 = S.strip(p0.x - dirn.du * HALF, p0.y - dirn.dv * HALF);
    var q2 = S.strip(p0.x + dirn.du * HALF, p0.y + dirn.dv * HALF);
    seg(ctx, q1, q2, THEME.assumed, 2.2, [8, 5]);
    text(ctx, '假设的面：不是等势面', q2.x + 8, q2.y - 10, THEME.assumed, 12.5, 'left');
  }

  /* ---------- 俯视图（物理空间） ---------- */
  function drawPlatesAndField(ctx, S, s) {
    var i, v;
    var yTop = S.strip(0, V1 + 0.35).y, yBot = S.strip(0, V0 - 0.35).y;
    var xL = S.strip(U0 - 0.18, 0).x, xR = S.strip(U1 + 0.18, 0).x;
    ctx.save(); ctx.strokeStyle = THEME.posLine; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(xL, yTop); ctx.lineTo(xL, yBot); ctx.stroke(); ctx.restore();
    text(ctx, '+', xL, yTop - 14, THEME.posLine, 18, 'center', '700');
    ctx.save(); ctx.strokeStyle = THEME.negLine; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(xR, yTop); ctx.lineTo(xR, yBot); ctx.stroke(); ctx.restore();
    text(ctx, '−', xR, yTop - 14, THEME.negLine, 18, 'center', '700');

    for (i = 0; i <= 4; i++) {
      v = lerp(V0, V1, i / 4);
      var a = S.strip(U0 - 0.18, v), b = S.strip(U1 + 0.18, v);
      seg(ctx, a, b, 'rgba(255,255,255,0.16)', 1.1);
      var m1 = S.strip(U0 + (U1 - U0) * 0.30, v), m2 = S.strip(U0 + (U1 - U0) * 0.62, v);
      arrow(ctx, m1, m2, 'rgba(255,255,255,0.38)', 1.3, 7);
    }
    text(ctx, 'E', xR + 16, yTop + 30, THEME.ink2, 14, 'center', '600');
  }

  /** 俯视图里的等势线（与电场线垂直的竖直白线） */
  function drawStripContours(ctx, S, s) {
    var k;
    for (k = -6; k <= 6; k++) {
      if (k === 0) { continue; }
      var u = P.contourU(k, s.x0, s.E, P.DU);
      if (u < U0 - 1e-6 || u > U1 + 1e-6) { continue; }
      seg(ctx, S.strip(u, V0 - 0.35), S.strip(u, V1 + 0.35), THEME.contour, 1.4);
    }
    if (S.W >= 760) {
      text(ctx, '竖直白线 = 等势线（⟂ 电场线）', S.W - 16, S.stripTop + 2, THEME.muted, 12, 'right');
    }
  }

  function drawStripMarks(ctx, S, s) {
    var list = s.show.marks || [];
    var i;
    for (i = 0; i < list.length; i++) {
      var pt = s[list[i]];
      if (!pt) { continue; }
      var p = S.strip(pt.x, pt.y);
      dot(ctx, p, 5, '#000000', THEME.ink);
      text(ctx, list[i], p.x, p.y - 15, THEME.ink, 13, 'center', '700');
    }
    if (s.show.phiLabels && S.W >= 760) {
      for (i = 0; i < list.length; i++) {
        var q2 = s[list[i]];
        if (!q2) { continue; }
        var p2 = S.strip(q2.x, q2.y);
        text(ctx, 'φ=' + P.phiAt(q2.x, s.x0, s.E).toFixed(0) + 'V', p2.x, p2.y + 16, THEME.muted, 11.5);
      }
    }
  }

  /** 俯视图里的“路” */
  function drawStripWalk(ctx, S, s) {
    var pts = walkPath(s);
    ctx.save();
    ctx.strokeStyle = s.show.assumed ? THEME.assumed : (s.show.equiLine ? THEME.ink : THEME.yellow);
    ctx.lineWidth = 2.6;
    if (s.show.assumed) { ctx.setLineDash([8, 5]); }
    ctx.beginPath();
    for (var j = 0; j < pts.length; j++) {
      var p = S.strip(pts[j].x, pts[j].y);
      if (j === 0) { ctx.moveTo(p.x, p.y); } else { ctx.lineTo(p.x, p.y); }
    }
    ctx.stroke(); ctx.restore();
  }

  function drawStripCharge(ctx, S, s, pos) {
    var p = S.strip(pos.x, pos.y);
    dot(ctx, p, 6.5, s.q > 0 ? THEME.posLine : THEME.negLine, '#000000');
    text(ctx, s.q > 0 ? '+' : '−', p.x, p.y + 0.5, '#000000', 12, 'center', '700');
    var f = P.force(s.q, s.E);
    var len = clamp(Math.abs(f) * 0.006, 0.22, 0.7) * (f >= 0 ? 1 : -1);
    var b = S.strip(pos.x + len, pos.y);
    arrow(ctx, p, b, THEME.gold, 2.2, 8);
    text(ctx, 'F', b.x + 9 * (f >= 0 ? 1 : -1), b.y - 10, THEME.gold, 13);
  }

  function drawStripZero(ctx, S, s) {
    var a = S.strip(s.x0, V0 - 0.35), b = S.strip(s.x0, V1 + 0.35);
    seg(ctx, a, b, THEME.zero, 2.4, [7, 5]);
  }

  /* ---------- 第 1 步：上楼情境（2D，铺满主视图） ---------- */
  function drawFloorInset(ctx, S, s) {
    var W = S.W, cx = W / 2, top = S.mainH * 0.14;
    var bw = Math.min(220, W * 0.20), bh = Math.min(S.mainH * 0.60, 250);
    function floors(x, f0, f1, tag, dim) {
      var col = dim ? 'rgba(255,255,255,0.35)' : THEME.ink;
      ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = 1.6;
      ctx.strokeRect(x - bw / 2, top, bw, bh); ctx.restore();
      text(ctx, tag, x, top - 16, dim ? THEME.muted : THEME.ink, 13, 'center', '600');
      for (var f = f0; f <= f1; f++) {
        var y = top + bh - (f - f0 + 0.5) * (bh / (f1 - f0 + 1.2));
        seg(ctx, { x: x - bw / 2, y: y }, { x: x + bw / 2, y: y }, col, 1.2);
        text(ctx, f + 'F', x + bw / 2 + 12, y, THEME.muted, 11.5, 'left');
      }
      var yA = top + bh - (0.5) * (bh / (f1 - f0 + 1.2));
      var yB = top + bh - (f1 - f0 + 0.5) * (bh / (f1 - f0 + 1.2));
      dimArrow(ctx, { x: x + bw / 2 + 34, y: yA }, { x: x + bw / 2 + 34, y: yB },
        dim ? 'rgba(255,255,255,0.4)' : THEME.yellow, 2);
      text(ctx, (f1 - f0) + ' 层的高度差', x + bw / 2 + 42, (yA + yB) / 2,
        dim ? THEME.muted : THEME.yellow, 12.5, 'left', '600');
    }
    floors(cx - W * 0.20, 6, 8, '六楼 → 八楼', false);
    floors(cx + W * 0.20, 20, 22, '二十楼 → 二十二楼', true);
    text(ctx, '做功取决于「两点的高度差」，不取决于楼有多高，也不取决于从哪一层出发',
      cx, S.mainH - 42, THEME.ink2, 14, 'center', '500');
    text(ctx, '—— 电场里，对应的是「两点之间的电势差」', cx, S.mainH - 18, THEME.yellow, 14.5, 'center', '700');
  }

  /* ---------- 第 20 步：两类电场的等势面（2D 并排） ---------- */
  function drawTwoFields(ctx, S, s) {
    var W = S.W, mainH = S.mainH, half = W / 2;
    var titleY = mainH * 0.10;
    var midY = mainH * 0.50;
    var room = Math.max(70, Math.min(midY - titleY - 26, mainH * 0.34));   // 半幅可用高度
    var cxA = half * 0.5, cxB = half * 1.5;
    var i;

    /* 左：匀强电场（平行板）—— 等势面是等间距的平面 */
    text(ctx, '匀强电场（平行板）', cxA, titleY, THEME.ink, 14, 'center', '600');
    var sc = room / 1.5;                                  // 极板半高 = room
    var yTop = midY - room, yBot = midY + room;
    ctx.save(); ctx.strokeStyle = THEME.posLine; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(cxA - sc * 1.5, yTop); ctx.lineTo(cxA - sc * 1.5, yBot); ctx.stroke();
    ctx.strokeStyle = THEME.negLine;
    ctx.beginPath(); ctx.moveTo(cxA + sc * 1.5, yTop); ctx.lineTo(cxA + sc * 1.5, yBot); ctx.stroke(); ctx.restore();
    text(ctx, '+', cxA - sc * 1.5, yTop - 16, THEME.posLine, 18, 'center', '700');
    text(ctx, '−', cxA + sc * 1.5, yTop - 16, THEME.negLine, 18, 'center', '700');
    for (i = 0; i <= 4; i++) {
      var yy = lerp(yTop + 6, yBot - 6, i / 4);
      seg(ctx, { x: cxA - sc * 1.5, y: yy }, { x: cxA + sc * 1.5, y: yy }, 'rgba(255,255,255,0.16)', 1);
      arrow(ctx, { x: cxA - sc * 0.5, y: yy }, { x: cxA + sc * 0.5, y: yy }, 'rgba(255,255,255,0.40)', 1.3, 7);
    }
    var d = P.equivGap(P.DU, 80);
    for (i = -2; i <= 2; i++) {                           // 等间距的等势线
      var xx = cxA + i * d * sc;
      if (Math.abs(i * d * sc) > sc * 1.5 - 2) { continue; }
      seg(ctx, { x: xx, y: yTop }, { x: xx, y: yBot }, THEME.contour, 1.6);
    }
    dimArrow(ctx, { x: cxA, y: yBot + 22 }, { x: cxA + d * sc, y: yBot + 22 }, THEME.yellow, 2);
    text(ctx, 'd = ' + d.toFixed(2) + ' m（处处相等）', cxA + d * sc + 12, yBot + 22, THEME.yellow, 12.5, 'left', '600');
    text(ctx, '相邻等势面 ΔU = 40 V', cxA, yBot + 50, THEME.ink2, 12.5, 'center');

    /* 右：点电荷（同心球面的剖面）—— 越近越密 */
    text(ctx, '点电荷（球面的剖面）', cxB, titleY, THEME.ink, 14, 'center', '600');
    var radii = P.pointRadii(P.KQ, P.DU, 6);
    var rMax = radii.length ? radii[radii.length - 1].r : P.R_MAX;
    var sc2 = room / rMax;
    for (i = 0; i < 12; i++) {
      var an = i * Math.PI / 6;
      seg(ctx, { x: cxB, y: midY }, { x: cxB + Math.cos(an) * room, y: midY - Math.sin(an) * room },
        'rgba(255,255,255,0.16)', 1);
      var r1 = rMax * 0.55, r2 = rMax * 0.94;
      arrow(ctx, { x: cxB + Math.cos(an) * r1 * sc2, y: midY - Math.sin(an) * r1 * sc2 },
                 { x: cxB + Math.cos(an) * r2 * sc2, y: midY - Math.sin(an) * r2 * sc2 },
        'rgba(255,255,255,0.42)', 1.3, 7);
    }
    for (i = 0; i < radii.length; i++) {
      ctx.save(); ctx.strokeStyle = THEME.contour; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(cxB, midY, radii[i].r * sc2, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    }

  function apply(st, i) {
    i = clamp(i, 0, STEPS.length - 1);
    var fresh = baseState();
    for (var k in fresh) { st[k] = fresh[k]; }
    var def = STEPS[i];
    st.step = i;
    st.act = def.act; st.title = def.title; st.hint = def.hint || '';
    st.note = def.note || ''; st.formula = def.formula || '';
    st.allow = {};
    var a;
    for (a in (def.allow || {})) { st.allow[a] = true; }
    if (def.init) { def.init(st); }
    for (a in (def.show || {})) { st.show[a] = def.show[a]; }
    // 电荷位置：沿路走的步骤由 lineT / t 决定
    if (st.show.equiLine || st.show.assumed || st.allow.t) {
      var pts = R.walkPath(st);
      var tt = st.show.equiLine || st.show.assumed ? st.lineT : st.t;
      st.ball = pointAt(pts, tt);
    }
    st.ball.x = clamp(st.ball.x, R.U0, R.U1);
    st.ball.y = clamp(st.ball.y, R.V0, R.V1);
    return st;

      html += barRow('W(+q)', q * U, Math.abs(q * U) / (Math.abs(q * U) || 1e-30) * 100, R.THEME.gold, jText(q * U));
      html += barRow('W(−q)', -q * U, 100, R.THEME.gold, jText(-q * U));
      html += '<div style="font-size:12px;color:#888888;margin-top:4px">同一个 U：正负电荷做功一正一负 —— 黄色量规不动，金色 W 换号</div>';
      return html;
    }
    return html;
  }

  /* ================= 控件状态 ================= */
  function show(el, on) { if (el) { el.classList[on ? 'remove' : 'add']('hidden'); } }
  function updateControls() {
    var a = st.allow;
    show($('wrapT'), !!a.t);
    show($('wrapLine'), !!a.line);
    show($('wrapE'), !!a.E);
    show($('wrapTheta'), !!a.theta);
    show($('wrapPath'), !!a.path);
    show($('wrapQ'), !!a.q);
    show($('wrapDir'), !!a.dir);
    show($('wrapMode'), !!a.mode);

    $('stepTitle').textContent = st.title;
    $('actTag').textContent = st.act;
    $('stepSn').textContent = (st.step + 1) + ' / ' + St.STEPS.length;
    $('hint').innerHTML = st.hint || '';
    $('prog').firstElementChild.style.width = ((st.step + 1) / St.STEPS.length * 100) + '%';

    $('rgT').value = Math.round(st.t * 100); $('lbT').textContent = Math.round(st.t * 100) + '%';
    $('rgLine').value = Math.round(st.lineT * 100); $('lbLine').textContent = Math.round(st.lineT * 100) + '%';
    $('rgE').value = st.E; $('lbE').textContent = st.E.toFixed(0);
    var deg = Math.round(st.theta * 180 / Math.PI);
    $('rgTheta').value = deg; $('lbTheta').textContent = deg + '°';

    var pb = document.querySelectorAll('#wrapPath button');
    for (var i = 0; i < pb.length; i++) {
      pb[i].className = (pb[i].getAttribute('data-path') === st.pathMode) ? 'on' : '';
    }
    var qb = document.querySelectorAll('#wrapQ button');
    for (i = 0; i < qb.length; i++) {
      qb[i].className = (Math.abs(parseFloat(qb[i].getAttribute('data-q')) - st.q) < 1e-9) ? 'on' : '';
    }
    var db = document.querySelectorAll('#wrapDir button');
    for (i = 0; i < db.length; i++) {
      db[i].className = (db[i].getAttribute('data-dir') === st.dir) ? 'on' : '';
    }
    var mb = document.querySelectorAll('#wrapMode button');
    for (i = 0; i < mb.length; i++) {
      mb[i].className = (mb[i].getAttribute('data-mode') === st.fieldMode) ? 'on' : '';
    }
  }

  /* ================= 翻页 ================= */
  function go(i) { St.apply(st, i); draw(); }
  function next() { go(st.step + 1); }
  function prev() { go(st.step - 1); }
  function resetStep() { go(st.step); }

  $('btnNext').addEventListener('click', next);
  $('btnPrev').addEventListener('click', prev);
  $('btnReset').addEventListener('click', resetStep);

  $('prog').addEventListener('click', function (ev) {
    var r = this.getBoundingClientRect();
    var f = clamp((ev.clientX - r.left) / r.width, 0, 0.999);
    go(Math.floor(f * St.STEPS.length));
  });
  (function ticks() {
    var bar = $('prog');
    for (var i = 1; i < St.STEPS.length; i++) {
      var u = document.createElement('u');
      u.style.left = (i / St.STEPS.length * 100) + '%';
      bar.appendChild(u);
    }
  })();

  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'ArrowRight' || ev.key === 'PageDown' || ev.key === ' ') { next(); ev.preventDefault(); }
    else if (ev.key === 'ArrowLeft' || ev.key === 'PageUp') { prev(); ev.preventDefault(); }
    else if (ev.key === 'Home') { go(0); ev.preventDefault(); }
  });

  /* ================= 滑块与按钮 ================= */
  $('rgT').addEventListener('input', function () {
    st.t = parseFloat(this.value) / 100;
    st.ball = St.pointAt(R.walkPath(st), st.t);
    draw();
  });
  $('rgLine').addEventListener('input', function () {
    st.lineT = parseFloat(this.value) / 100;
    st.ball = St.pointAt(R.walkPath(st), st.lineT);
    draw();
  });
  $('rgE').addEventListener('input', function () {
    st.E = parseFloat(this.value);
    draw();
  });
  $('rgTheta').addEventListener('input', function () {
    st.theta = parseFloat(this.value) * Math.PI / 180;
    st.ball = St.pointAt(R.walkPath(st), st.lineT);
    draw();
  });
  (function () {
    var pb = document.querySelectorAll('#wrapPath button');
    for (var i = 0; i < pb.length; i++) {
      pb[i].addEventListener('click', function () {
        st.pathMode = this.getAttribute('data-path');
        if (st.allow.t) { st.ball = St.pointAt(R.walkPath(st), st.t); }
        draw();
      });
    }
    var qb = document.querySelectorAll('#wrapQ button');
    for (i = 0; i < qb.length; i++) {
      qb[i].addEventListener('click', function () {
        st.q = parseFloat(this.getAttribute('data-q'));
        draw();
      });
    }
    var db = document.querySelectorAll('#wrapDir button');
    for (i = 0; i < db.length; i++) {
      db[i].addEventListener('click', function () {
        st.dir = this.getAttribute('data-dir');
        draw();
      });
    }
    var mb = document.querySelectorAll('#wrapMode button');
    for (i = 0; i < mb.length; i++) {
      mb[i].addEventListener('click', function () {
        st.fieldMode = this.getAttribute('data-mode');
        draw();
      });
    }
  })();

  /* ================= 拖动 ================= */
  /** 屏幕上离鼠标最近的路点对应的进度（沿路径拖动电荷用） */
  function pathTAt(S, px, py) {
    var pts = R.walkPath(st), bestT = 0, bestD = Infinity;
    for (var i = 0; i <= 120; i++) {
      var t = i / 120, w = St.pointAt(pts, t);
      var sc = S.main(w.x, w.y, P.phiAt(w.x, st.x0, st.E));
      var d = (sc.x - px) * (sc.x - px) + (sc.y - py) * (sc.y - py);
      if (d < bestD) { bestD = d; bestT = t; }
    }
    return bestT;
  }

  function evPos(ev) {
    var r = cv.getBoundingClientRect();
    var t = ev.touches ? ev.touches[0] : ev;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  }
  function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
  function segDist(p, a, b) {
    var vx = b.x - a.x, vy = b.y - a.y, wx = p.x - a.x, wy = p.y - a.y;
    var L2 = vx * vx + vy * vy;
    var t = L2 > 0 ? clamp((wx * vx + wy * vy) / L2, 0, 1) : 0;
    return Math.hypot(p.x - (a.x + t * vx), p.y - (a.y + t * vy));
  }

  function hit(p) {
    if (!S) { return null; }
    var ballScr = S.main(st.ball.x, st.ball.y, P.phiAt(st.ball.x, st.x0, st.E));
    if (st.allow.ball && dist(p, ballScr) < 34) { return 'ball'; }
    if (st.allow.zero) {
      var z0 = S.main(st.x0, -1.2, 0), z1 = S.main(st.x0, 1.2, 0);
      if (segDist(p, z0, z1) < 15) { return 'zero'; }
    }
    var marks = st.show.marks || [];
    for (var i = 0; i < marks.length; i++) {
      var m = st[marks[i]];
      if (m && st.allow[marks[i]] && dist(p, S.strip(m.x, m.y)) < 22) { return marks[i]; }
    }
    return null;
  }

  function onDown(ev) {
    var p = evPos(ev);
    var forceOrbit = (ev.button === 2) || (ev.button === 1) || ev.shiftKey || ev.altKey || ev.metaKey;
    var mode = forceOrbit ? null : hit(p);
    if (!mode && S && p.y < S.mainH) { mode = 'orbit'; }
    if (!mode) { return; }
    drag = { mode: mode, last: p };
    cv.style.cursor = (mode === 'orbit') ? 'move' : 'grabbing';
    ev.preventDefault();
  }
  function onMove(ev) {
    if (!drag) {
      var m = hit(evPos(ev));
      cv.style.cursor = m ? (m === 'ball' ? 'grab' : 'ew-resize') : 'default';
      return;
    }
    var p = evPos(ev), dx = p.x - drag.last.x, dy = p.y - drag.last.y;
    drag.last = p;
    if (drag.mode === 'orbit') {
      cam.az -= dx * 0.008;
      cam.el = clamp(cam.el + dy * 0.006, 0.05, 1.50);
      draw();
      ev.preventDefault();
      return;
    }
    if (drag.mode === 'ball') {
      if (st.allow.t) {
        st.t = pathTAt(S, p.x, p.y);
        st.ball = St.pointAt(R.walkPath(st), st.t);
      } else if (st.allow.line) {
        st.lineT = pathTAt(S, p.x, p.y);
        st.ball = St.pointAt(R.walkPath(st), st.lineT);
      } else {
        var kb = R.uPerPixel(S, st.ball.x, st.ball.y, P.phiAt(st.ball.x, st.x0, st.E));
        if (kb) { st.ball.x = clamp(st.ball.x + (dx * kb.dx + dy * kb.dy) / kb.len2, R.U0, R.U1); }
      }
    } else if (drag.mode === 'zero') {
      var kz = R.uPerPixel(S, st.x0, 0, 0);
      if (kz) { st.x0 = clamp(st.x0 + (dx * kz.dx + dy * kz.dy) / kz.len2, R.X0MIN, R.X0MAX); }
    } else {
      var d = S.stripInv(dx, dy);
      var pt = st[drag.mode];
      if (pt) {
        pt.x = clamp(pt.x + d.du, R.U0 + 0.15, R.U1 - 0.15);
        pt.y = clamp(pt.y + d.dv, R.V0 + 0.1, R.V1 - 0.1);
        if (drag.mode === 'A' && (st.show.equiLine || st.show.assumed)) { st.walkFrom = pt.x; }
      }
    }
    draw();
    ev.preventDefault();
  }
  function onUp() { if (drag) { drag = null; cv.style.cursor = 'default'; } }

  cv.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });
  cv.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  cv.addEventListener('touchstart', onDown, { passive: false });
  cv.addEventListener('touchmove', onMove, { passive: false });
  window.addEventListener('touchend', onUp);

  cv.addEventListener('wheel', function (ev) {
    ev.preventDefault();
    cam.zoom = clamp(cam.zoom * Math.exp(-ev.deltaY * 0.0012), 0.5, 2.6);
    draw();
  }, { passive: false });
  cv.addEventListener('dblclick', function () { setView('reset'); });

  (function () {
    var btns = document.querySelectorAll('#wrapView button');
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener('click', function () { setView(this.getAttribute('data-view')); });
    }
  })();

  var rzT = null;
  window.addEventListener('resize', function () {
    clearTimeout(rzT); rzT = setTimeout(draw, 120);
  });

  /* ================= 顶部步骤导航条 ================= */
  var tocEl = $('toc'), tocLinks = [], tocMarked = -1;
  (function buildToc() {
    if (!tocEl) { return; }
    var curAct = null;
    for (var i = 0; i < St.STEPS.length; i++) {
      var def = St.STEPS[i];
      if (def.act !== curAct) {
        if (curAct !== null) {
          var sp = document.createElement('span'); sp.className = 'sep'; tocEl.appendChild(sp);
        }
        curAct = def.act;
        var lab = document.createElement('span');
        lab.className = 'grouplab';
        lab.textContent = String(def.act).split('·')[0].trim();
        lab.title = def.act;
        tocEl.appendChild(lab);
      }
      var a = document.createElement('a');
      a.title = (i + 1) + '. ' + def.title;
      a.textContent = String(i + 1);
      (function (idx, node) { node.addEventListener('click', function () { go(idx); }); })(i, a);
      tocEl.appendChild(a);
      tocLinks.push(a);
    }
  })();
  function markToc() {
    if (!tocLinks.length || tocMarked === st.step) { return; }
    tocMarked = st.step;
    for (var i = 0; i < tocLinks.length; i++) {
      var on = (i === st.step);
      tocLinks[i].className = on ? 'on' : '';
      if (on && tocLinks[i].scrollIntoView) { tocLinks[i].scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
    }
  }

  /* ================= 自检 / 调试接口 ================= */
  function hash() {
    var f = R.fitCanvas(cv);
    var W = Math.floor(f.W), H = Math.floor(f.H);
    var d = f.ctx.getImageData(0, 0, W, H).data;
    var h = 2166136261 >>> 0;
    for (var i = 0; i < d.length; i += 61) { h ^= d[i]; h = (h * 16777619) >>> 0; }
    return ('00000000' + h.toString(16)).slice(-8);
  }

  /**
   * 本课物理专项验证（在页面里跑，报出用例数与最大误差）
   *   ① U 与零点无关  ② U_BA = −U_AB  ③ 可加性  ④ 教材例题四问
   *   ⑤ W = qU = EpA − EpB  ⑥ 沿等势面移动 W = 0  ⑦ 反证法 θ
   */
  function verifyU() {
    var worst = 0, cases = 0, bad = [];
    function chk(a, b, tag) {
      cases++;
      var e = Math.abs(a - b);
      if (e > worst) { worst = e; }
      if (e > 1e-9) { bad.push(tag + ' err=' + e); }
    }
    var x0s = [-1.7, -0.9, 0, 0.6, 1.7], Es = [60, 80, 100, 120], qs = [2, 1, -1, -2];
    var ABs = [[-1.4, 1.2], [0.75, 1.75], [-2.4, -2.4], [1.75, -0.75], [0.4, 0.4]];
    var i, j, k;
    for (i = 0; i < ABs.length; i++) {
      for (j = 0; j < Es.length; j++) {
        var E = Es[j], xa = ABs[i][0], xb = ABs[i][1];
        var u0 = P.uAB(xa, xb, E);
        for (k = 0; k < x0s.length; k++) {
          chk(P.phiAt(xa, x0s[k], E) - P.phiAt(xb, x0s[k], E), u0, '①U 与零点无关');
        }
        chk(P.uBA(xa, xb, E), -u0, '②U_BA = −U_AB');
        for (k = 0; k < qs.length; k++) {
          var q = P.qOf(qs[k]);
          chk(P.work(q, xa, xb, E), q * u0, '⑤W = qU');
          chk(P.epAt(q, xa, x0s[2], E) - P.epAt(q, xb, x0s[2], E), q * u0, '⑤W = EpA − EpB');
        }
      }
      chk(P.uAB(ABs[i][0], ABs[i][1], 80) + P.uAB(ABs[i][1], -0.75, 80),
        P.uAB(ABs[i][0], -0.75, 80), '③可加性');
    }
    /* ④ 教材例题四问 */
    chk(P.uAB(0.75, 1.75, 80), 80, '④教材 U_AB = +80 V');
    chk(P.uAB(1.75, -0.75, 80), -200, '④教材 U_BC = −200 V');
    chk(P.uAB(0.75, -0.75, 80), -120, '④教材 U_AC = −120 V');
    chk(P.work(P.qOf(2), 0.75, 1.75, 80), 1.6e-7, '④教材 W_AB = +1.6×10⁻⁷ J');
    chk(P.work(P.qOf(-1.5), 0.75, -0.75, 80), 1.8e-7, '④教材第三刀 W_AC = +1.8×10⁻⁷ J');

    /* ⑥ 沿等势面移动（Δu = 0）：任意分段数、任意 q */
    var Ns = [1, 2, 3, 8, 32];
    for (i = 0; i < Ns.length; i++) {
      var line = [{ x: 0.75, y: -1.2 }];
      for (k = 0; k <= Ns[i]; k++) { line.push({ x: 0.75, y: -1.2 + 2.4 * k / Ns[i] }); }
      for (j = 0; j < qs.length; j++) {
        chk(P.accumulate(line, P.qOf(qs[j]), 80).W, 0, '⑥沿等势面 W = 0 (N=' + Ns[i] + ')');
      }
    }
    /* ⑦ 反证法 */
    var ths = [5, 10, 20, 40], halfs = [0.2, 0.6, 1.0];
    for (i = 0; i < ths.length; i++) {
      for (j = 0; j < halfs.length; j++) {
        var th = ths[i] * Math.PI / 180;
        var seg = P.assumedLine({ x: 0.75, y: 0 }, th, halfs[j]);
        chk(P.accumulate(seg, P.qOf(1), 80).W, P.workOnAssumed(P.qOf(1), 80, th, 2 * halfs[j]),
          '⑦沿假设面做功 θ=' + ths[i] + '°');
        cases++;
        if (Math.abs(P.workOnAssumed(P.qOf(1), 80, th, 2 * halfs[j])) <= 1e-20) { bad.push('⑦θ≠0 却算出不做功'); }
      }
    }
    chk(P.accumulate(P.assumedLine({ x: 0.75, y: 0 }, 0, 1.0), P.qOf(1), 80).W, 0, '⑦θ=0 时 W = 0');
    return { ok: bad.length === 0, cases: cases, maxErr: worst, failed: bad.slice(0, 3) };
  }

  window.__viz = {
    state: st,
    cam: cam,
    setView: setView,
    count: St.STEPS.length,
    go: go, next: next, prev: prev, reset: resetStep, draw: draw,
    hash: hash,
    render: R, phys: P, steps: St,
    verifyU: verifyU,
    selfTest: function () { return P.runSelfTest(); },
    stepMeta: function () {
      return St.STEPS.map(function (d, i) {
        return { i: i, act: d.act, title: d.title, allow: Object.keys(d.allow || {}), hint: d.hint || '' };
      });
    }
  };

  /* ================= 启动 ================= */
  St.apply(st, 0);
  draw();
  setTimeout(draw, 60);
})();

</script>
</body>
</html>
